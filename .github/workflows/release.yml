name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: tourvia-windows-x86_64.zip
            compress_cmd: Compress-Archive -Path target/release/tourvia.exe -DestinationPath tourvia-windows-x86_64.zip
            shell: powershell
          - os: ubuntu-latest
            asset_name: tourvia-linux-x86_64.tar.gz
            compress_cmd: tar -czvf tourvia-linux-x86_64.tar.gz -C target/release tourvia
            shell: bash
          - os: macos-latest
            asset_name: tourvia-macos-universal.tar.gz
            compress_cmd: tar -czvf tourvia-macos-universal.tar.gz -C target/release tourvia
            shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev libgtk-3-dev libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release

      - name: Compress Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: ${{ matrix.compress_cmd }}
        shell: powershell

      - name: Compress Binary (Linux/MacOS)
        if: matrix.os != 'windows-latest'
        run: ${{ matrix.compress_cmd }}
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: tourvia ${{ github.ref_name }}
          files: ${{ matrix.asset_name }}
          generate_release_notes: ${{ matrix.os == 'ubuntu-latest' }}
