name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  # 1. Tahap Pengujian & Pengecekan Kualitas Kode
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev libgtk-3-dev libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        continue-on-error: true # Tidak membatalkan pipeline jika format kurang rapi
        run: cargo fmt --all -- --check

      - name: Run Clippy (Linting)
        continue-on-error: true
        run: cargo clippy --all-features

      - name: Run Tests
        run: cargo test --all-features

  # 2. Tahap Build untuk masing-masing OS
  build:
    name: Build (${{ matrix.os }})
    needs: test # Menunggu tahap test selesai
    if: github.event_name == 'push' # Hanya lakukan build jika push, bukan saat pull request
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Jika satu OS gagal, OS lain tetap dilanjutkan
      matrix:
        include:
          - os: windows-latest
            asset_name: tourvia-windows-x86_64
          - os: ubuntu-latest
            asset_name: tourvia-linux-x86_64
          - os: macos-latest
            asset_name: tourvia-macos-universal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev libgtk-3-dev libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release_package
          # Pindahkan file .exe (Windows) atau binary file (Linux/Mac)
          cp target/release/tourvia.exe release_package/ 2>/dev/null || true
          cp target/release/tourvia release_package/ 2>/dev/null || true
          # Sertakan juga file README
          cp README.md release_package/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release_package/*
          retention-days: 1 # Hanya disimpan 1 hari karena akan dimasukkan ke GitHub Release

  # 3. Tahap Publikasi Release (Menggabungkan semua hasil Build)
  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tourvia-windows-x86_64
          path: tourvia-windows-x86_64

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tourvia-linux-x86_64
          path: tourvia-linux-x86_64

      - name: Download MacOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tourvia-macos-universal
          path: tourvia-macos-universal

      - name: Package Release Files
        run: |
          cd tourvia-windows-x86_64 && zip -r ../tourvia-windows-x86_64.zip . && cd ..
          cd tourvia-linux-x86_64 && tar -czvf ../tourvia-linux-x86_64.tar.gz . && cd ..
          cd tourvia-macos-universal && tar -czvf ../tourvia-macos-universal.tar.gz . && cd ..

      - name: Generate Version Tag
        id: tag
        run: echo "tag=v2.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Tourvia ${{ steps.tag.outputs.tag }}
          files: |
            tourvia-windows-x86_64.zip
            tourvia-linux-x86_64.tar.gz
            tourvia-macos-universal.tar.gz
          generate_release_notes: true
